version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ecolearn
      POSTGRES_USER: ecolearn
      POSTGRES_PASSWORD: ecolearn123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
